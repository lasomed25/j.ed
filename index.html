<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jupiter | Login</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Roboto,sans-serif}
    body{background:#f4f8ff;display:flex;flex-direction:column;min-height:100vh}
    header{background:#003366;color:white;display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem}
    header h1{font-size:1.6rem}
    nav a{color:white;margin-left:1.5rem;text-decoration:none}
    nav a:hover{text-decoration:underline}
    main{flex:1;display:flex;justify-content:center;align-items:center;padding:2rem}
    .login-card{background:white;padding:2rem;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,0.1);max-width:400px;width:100%}
    .login-card h2{text-align:center;color:#003366;margin-bottom:1.5rem}
    .login-card input{width:100%;padding:0.8rem;margin:0.5rem 0;border:1px solid #ccc;border-radius:5px}
    .login-card button{width:100%;background:#003366;color:white;padding:0.9rem;border:none;border-radius:5px;margin-top:1rem;cursor:pointer}
    .login-card button:hover{background:#002244}
    footer{text-align:center;background:#003366;color:white;padding:1rem;font-size:0.9rem}
  </style>
</head>
<body>
  <header>
    <h1>Jupiter</h1>
    <nav>
      <a href="#">Login</a>
      <a href="#">Grades</a>
      <a href="#">Assignments</a>
      <a href="#">Help</a>
    </nav>
  </header>

  <main>
    <div class="login-card">
      <h2>Sign In</h2>
      <form id="loginForm">
        <input type="text" id="school" placeholder="School Name or Code" required />
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <p style="text-align:center;margin-top:1rem;"><a href="#" style="color:#003366;">Forgot password?</a></p>
    </div>
  </main>

  <footer>© 2025 Jupiter Clone — Demo Only</footer>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const school = document.getElementById("school").value.trim();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value;

      // demo credentials
      if (school === "demo-school" && user === "demouser" && pass === "demo123") {
        window.location.href = "dashboard.html";
      } else {
        alert("Invalid login.\nTry:\nSchool: demo-school\nUser: demouser\nPass: demo123");
      }
    });
  </script>
</body>
</html>
